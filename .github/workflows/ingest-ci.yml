name: psx-ingest CI

on:
  push:
    branches: [main]
    paths:
      - "psx-ingest/**"
      - ".github/workflows/ingest-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "psx-ingest/**"
      - ".github/workflows/ingest-ci.yml"

defaults:
  run:
    working-directory: psx-ingest

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: psx-ingest/.venv
          key: psx-ingest-venv-${{ hashFiles('psx-ingest/pyproject.toml') }}

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy psx_ingest/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: psx_user
          POSTGRES_PASSWORD: psx_pass
          POSTGRES_DB: psx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://psx_user:psx_pass@localhost:5432/psx_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest --cov=psx_ingest --cov-report=xml --cov-fail-under=80 -v
