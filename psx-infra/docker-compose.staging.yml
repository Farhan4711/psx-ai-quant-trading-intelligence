name: psx-staging

# Staging stack — full application on Hetzner
# Usage (as app user on server):
#   cd /opt/psx-app/psx-infra
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d

services:

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: psx_postgres_staging
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: psx_staging,psx_test
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./init-scripts/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
      - ./init-scripts/02-enable-timescaledb.sql:/docker-entrypoint-initdb.d/02-enable-timescaledb.sql:ro
    networks:
      - psx_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d psx_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No port exposure — only accessible via internal Docker network

  redis:
    image: redis:7-alpine
    container_name: psx_redis_staging
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_staging_data:/data
    networks:
      - psx_internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  psx-api:
    image: ghcr.io/${GITHUB_REPO}/psx-api:${API_IMAGE_TAG:-latest}
    container_name: psx_api_staging
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/psx_staging
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      SECRET_KEY: ${API_SECRET_KEY}
      ENVIRONMENT: staging
      ALLOWED_ORIGINS: ${FRONTEND_URL}
      SENTRY_DSN: ${SENTRY_DSN_API}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME}
    networks:
      - psx_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  psx-worker:
    image: ghcr.io/${GITHUB_REPO}/psx-ingest:${INGEST_IMAGE_TAG:-latest}
    container_name: psx_worker_staging
    restart: always
    command: celery -A psx_ingest.worker worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/psx_staging
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ENVIRONMENT: staging
      SENTRY_DSN: ${SENTRY_DSN_INGEST}
    networks:
      - psx_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  psx-beat:
    image: ghcr.io/${GITHUB_REPO}/psx-ingest:${INGEST_IMAGE_TAG:-latest}
    container_name: psx_beat_staging
    restart: always
    command: celery -A psx_ingest.worker beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/psx_staging
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ENVIRONMENT: staging
    networks:
      - psx_internal
    depends_on:
      - psx-worker

  caddy:
    image: caddy:2-alpine
    container_name: psx_caddy_staging
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_staging_data:/data
      - caddy_staging_config:/config
    networks:
      - psx_internal
    depends_on:
      - psx-api

networks:
  psx_internal:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
  caddy_staging_data:
  caddy_staging_config:
