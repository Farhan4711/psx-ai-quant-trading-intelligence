[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psx-inference"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "onnxruntime==1.20.1",
    "numpy==1.26.4",
    "redis==5.2.1",
    "sentry-sdk[fastapi]==2.19.0",
    "structlog==24.4.0",
    "httpx==0.28.0",
]

[project.optional-dependencies]
# Training deps — only needed when training, not at serve time
train = [
    "torch==2.5.1",
    "scikit-learn==1.5.2",
    "xgboost==2.1.3",
    "pandas==2.2.3",
    "pandas-ta==0.3.14b",
    "vectorbt==0.26.2",
    "skl2onnx==1.17.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["psx_inference"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Colab training notebook — exploratory ML code, not application code.
# print()/X/y-style names/compact cells are normal there, not lint issues.
extend-exclude = ["notebooks/"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "DTZ", "T20", "RUF"]
ignore = [
    "S101",
    # RUF001-003 flag ambiguous unicode in string/docstring/comment *content*
    # (aimed at confusable identifiers). We use real en/em dashes deliberately
    # in prose and comments — not a spoofing risk here.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["psx_inference"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
