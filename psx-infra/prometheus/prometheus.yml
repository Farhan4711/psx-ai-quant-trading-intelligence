global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: production
    app: psx-ai-trading

scrape_configs:

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "psx-api"
    static_configs:
      - targets: ["psx-api:8000"]
    metrics_path: /metrics

  - job_name: "psx-inference"
    static_configs:
      - targets: ["psx-inference:8001"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
