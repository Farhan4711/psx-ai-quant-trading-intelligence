name: psx-inference CI

on:
  push:
    branches: [main]
    paths:
      - "psx-inference/**"
      - ".github/workflows/inference-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "psx-inference/**"
      - ".github/workflows/inference-ci.yml"

defaults:
  run:
    working-directory: psx-inference

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: psx-inference/.venv
          key: psx-inference-venv-${{ hashFiles('psx-inference/pyproject.toml') }}

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: mypy strict
        run: uv run mypy psx_inference/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Run tests
        run: uv run pytest --cov=psx_inference --cov-report=xml --cov-fail-under=80 -v
