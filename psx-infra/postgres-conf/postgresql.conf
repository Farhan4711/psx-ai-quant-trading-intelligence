# PostgreSQL tuning for Hetzner CCX23 (4 vCPU, 16 GB RAM)
# Generated for PSX App production workload.
# Adjust shared_buffers and effective_cache_size if you change server size.

# ─── Memory ───────────────────────────────────────────────────────────────────
shared_buffers = 4GB                  # 25% of RAM
effective_cache_size = 12GB           # 75% of RAM
work_mem = 64MB                       # per sort/hash op; watch for OOM with many connections
maintenance_work_mem = 1GB            # for VACUUM, CREATE INDEX

# ─── WAL / Checkpoints ────────────────────────────────────────────────────────
wal_buffers = 64MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# ─── Connections ──────────────────────────────────────────────────────────────
max_connections = 100                 # use PgBouncer if you need more

# ─── Planner ──────────────────────────────────────────────────────────────────
random_page_cost = 1.1               # SSD storage (Hetzner NVMe)
effective_io_concurrency = 200       # SSD

# ─── Parallel queries ─────────────────────────────────────────────────────────
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# ─── Logging ──────────────────────────────────────────────────────────────────
log_min_duration_statement = 1000    # log queries > 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = off                 # too noisy with connection pooling
log_disconnections = off
log_lock_waits = on
log_temp_files = 10MB

# ─── TimescaleDB ──────────────────────────────────────────────────────────────
timescaledb.max_background_workers = 4
shared_preload_libraries = 'timescaledb,pg_stat_statements'
