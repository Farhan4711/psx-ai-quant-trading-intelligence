name: psx-api CI

on:
  push:
    branches: [main]
    paths:
      - "psx-api/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "psx-api/**"
      - ".github/workflows/api-ci.yml"

defaults:
  run:
    working-directory: psx-api

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: psx-api/.venv
          key: psx-api-venv-${{ hashFiles('psx-api/pyproject.toml') }}

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy psx_api/

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: psx_user
          POSTGRES_PASSWORD: psx_pass
          POSTGRES_DB: psx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://psx_user:psx_pass@localhost:5432/psx_test
      DATABASE_TEST_URL: postgresql+asyncpg://psx_user:psx_pass@localhost:5432/psx_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-used-in-production
      ENVIRONMENT: test
      SMTP_HOST: ""
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Cache uv virtualenv
        uses: actions/cache@v4
        with:
          path: psx-api/.venv
          key: psx-api-venv-${{ hashFiles('psx-api/pyproject.toml') }}

      - name: Install dependencies
        run: uv venv && uv pip install -e ".[dev]"

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: uv run pytest --cov=psx_api --cov-report=xml --cov-fail-under=80 -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: psx-api/coverage.xml
          flags: psx-api
        continue-on-error: true

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./psx-api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/psx-api:latest
            ghcr.io/${{ github.repository }}/psx-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
