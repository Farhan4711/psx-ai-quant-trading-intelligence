[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psx-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy[asyncio]==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "pydantic==2.10.2",
    "pydantic-settings==2.6.1",
    "argon2-cffi==23.1.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "celery==5.4.0",
    "redis==5.2.1",
    "httpx==0.28.0",
    "sentry-sdk[fastapi]==2.19.0",
    "structlog==24.4.0",
    "python-multipart==0.0.18",
    "email-validator==2.2.0",
    "pyotp==2.9.0",
    "aiosmtplib==3.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.0",
    "ruff==0.8.3",
    "mypy==1.13.0",
    "types-passlib==1.7.7.20240819",
    "types-python-jose==3.3.4.20240106",
]

[tool.hatch.build.targets.wheel]
packages = ["psx_api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "S",        # flake8-bandit (security)
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez
    "T20",      # flake8-print (no print() in production)
    "RUF",      # ruff-specific rules
]
ignore = [
    "S101",     # assert allowed in tests
    "B008",     # FastAPI Depends() in function defaults
    # RUF001-003 flag ambiguous unicode in string/docstring/comment *content*
    # (aimed at confusable identifiers). We use real en/em dashes deliberately
    # in prose, comments, and user-facing labels (e.g. tax bracket text) —
    # not a spoofing risk here.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
# Standard Alembic pattern: model imports must follow config setup so
# autogenerate can see them — can't be hoisted to the top of the file.
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "passlib.*", "jose.*", "pyotp.*", "aiosmtplib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["psx_api"]
omit = ["tests/*", "alembic/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
